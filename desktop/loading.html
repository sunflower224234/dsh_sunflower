<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Harness</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #f2f7ff;
    background: #0e1420;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    user-select: none;
    -webkit-user-select: none;
  }
  /* Full-bleed wallpaper — 每次启动由主进程随机挑选，经 ?bg=<file> 下发 */
  .bg {
    position: fixed; inset: 0;
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    z-index: 0;
  }
  /* 壁纸本身占满窗口不压暗；只给标题文字垫一层很轻的暗底，让亮色壁纸也能看清 */
  .veil {
    position: fixed; inset: 0; z-index: 1;
    background:
      radial-gradient(78% 62% at 16% 88%, rgba(6, 14, 32, 0.50) 0%, rgba(6, 14, 32, 0.00) 72%),
      linear-gradient(180deg, rgba(8, 18, 38, 0.10) 0%, rgba(8, 18, 38, 0.00) 40%);
  }
  html[data-theme="night"] .veil {
    background:
      radial-gradient(78% 62% at 16% 88%, rgba(4, 10, 24, 0.44) 0%, rgba(4, 10, 24, 0.00) 72%),
      linear-gradient(180deg, rgba(6, 12, 28, 0.14) 0%, rgba(8, 18, 38, 0.00) 40%);
  }
  /* 内容靠左下角摆放：人物主体在画面中央，左侧留白既避开了脸，也更像启动器 */
  .box {
    position: relative; z-index: 2;
    margin: 0 0 46px 46px;
    display: flex; align-items: center; gap: 20px;
    text-align: left;
    padding: 18px 26px 18px 18px;
    border-radius: 22px;
    background: rgba(10, 18, 36, 0.38);
    border: 1px solid rgba(255, 255, 255, 0.14);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);
    backdrop-filter: blur(10px) saturate(1.1);
    box-shadow: 0 18px 44px rgba(4, 12, 30, 0.35);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .logo {
    width: 96px; height: 96px; flex: none;
    filter: drop-shadow(0 12px 26px rgba(8, 26, 60, 0.55)) drop-shadow(0 0 22px rgba(96, 158, 255, 0.5));
    animation: float 3.6s ease-in-out infinite;
  }
  .meta { display: flex; flex-direction: column; gap: 4px; padding-right: 8px; }
  h1 {
    font-size: 25px; font-weight: 600; letter-spacing: 2px;
    text-shadow: 0 2px 16px rgba(10, 28, 62, 0.7), 0 1px 3px rgba(10, 25, 55, 0.55);
  }
  .sub {
    margin-top: 4px; font-size: 13px; color: rgba(228, 240, 255, 0.94);
    letter-spacing: 1px; text-shadow: 0 1px 10px rgba(10, 28, 62, 0.6);
  }
  .spinner {
    margin-top: 12px; width: 20px; height: 20px;
    border-radius: 50%;
    border: 2.5px solid rgba(255, 255, 255, 0.28);
    border-top-color: #ffffff;
    animation: spin 0.85s linear infinite;
    box-shadow: 0 0 0 1px rgba(10, 30, 70, 0.25), 0 0 14px rgba(140, 185, 255, 0.4);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
<script>
  // 背景图由主进程随机挑选后经 ?bg=<file> 传入（assets/backgrounds/<file>）。
  // 内联在 <head>，首帧即带图，避免启动时闪一下纯色底。
  (function () {
    try {
      var file = new URLSearchParams(location.search).get('bg');
      if (!file) return;
      // 只接受纯文件名，避免路径穿越
      if (file.indexOf('/') !== -1 || file.indexOf('\\') !== -1 || file.indexOf('..') !== -1) return;
      var url = new URL('assets/backgrounds/' + encodeURIComponent(file), location.href).href;
      document.documentElement.style.setProperty('--bg-image', 'url("' + url + '")');
      // 夜晚图用更轻的压暗，白天/海边图用更重的压暗（见 .veil 的两套值）
      if (/night|夜晚/i.test(file)) document.documentElement.setAttribute('data-theme', 'night');
    } catch (err) { /* 保底：.bg 无图时露出 body 深色底 */ }
  })();
</script>
</head>
<body>
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="box">
    <img class="logo" src="splash.png" alt="DeepSeek Harness">
    <div class="meta">
      <h1>DeepSeek Harness</h1>
      <div class="sub">正在启动本地服务…</div>
      <div class="spinner"></div>
    </div>
  </div>
</body>
</html>
